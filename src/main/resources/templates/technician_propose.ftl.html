<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Proposal</title>
    <link rel="stylesheet" href="${contextPath}/style/main.css">
</head>
<body>

<header>
    <h1>Submit Proposal for Request #${requestId}</h1>
    <nav>
        <a href="${contextPath}/technician/dashboard">Dashboard</a>
        <a href="${contextPath}/logout">Logout</a>
    </nav>
</header>

<main>
    <#if message??>
        <div class="alert success">${message}</div>
    </#if>

    <form method="post" action="${contextPath}/technician/propose" class="form-card">
        <input type="hidden" name="requestId" value="${requestId}" />

        <label for="features">Features:</label>
        <textarea name="features" id="features" rows="4" required></textarea>

        <label for="price">Price (EUR):</label>
        <input type="number" name="price" id="price" step="0.01" min="0" required>

        <label for="date">Delivery Date:</label>
        <input type="date" name="date" id="date" required>

        <button type="submit">Submit Proposal</button>
    </form>

    <p><a href="${contextPath}/technician/dashboard">⬅ Back to Dashboard</a></p>
</main>

<style>
    .form-card {
        max-width: 600px;
    }
    
    input, textarea {
        font-size: 16px;
    }
</style>

</body>
</html>
